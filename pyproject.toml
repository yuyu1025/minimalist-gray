[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gray-release"
version = "0.1.0"
description = "Minimalist Kubernetes blue/green release CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ruamel.yaml>=0.18.0",
]

[project.scripts]
gray-release = "gray_release.cli:main"
